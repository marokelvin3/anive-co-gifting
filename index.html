                      <div className="text-emerald-700 font-semibold">Cutoff: 2:00 PM Daily for Same-Day Handover</div>

                      <input type="text" required placeholder="Your Name" className="w-full bg-sage-50 border border-sage-200 rounded-xl px-3 py-2 text-xs text-sage-900 focus:outline-none" />

                    </div>
                    <select className="w-full bg-sage-50 border border-sage-200 rounded-xl px-3 py-2 text-xs text-sage-900 focus:outline-none">
                      <option>Bridesmaids Gift Boxes & Bags</option>
                      <option>Personalised Gift Boxes</option>
                      <option>Emergency & Last-Minute Gifting</option>
                      <option>Corporate Gifting</option>
                      <option>Wedding & Event Gifting</option>
                      <option>Gift Sourcing & Bespoke Curation</option>
                      <option>General Atelier Inquiry</option>
                    </select>
                    <textarea rows="4" required placeholder="Write your message or project requirements..." className="w-full bg-sage-50 border border-sage-200 rounded-xl p-3 text-xs text-sage-900 focus:outline-none"></textarea>
                    <button type="submit" className="w-full py-3 rounded-2xl bg-sage-900 hover:bg-black text-white text-xs font-semibold shadow-luxury transition">
                      Send Message to Atelier Concierge
                    </button>
                  </form>
                </div>

              </div>
            </div>
          </section>

          {/* FOOTER WITH COMPLETE 15 CATEGORY DIRECTORY */}
          <footer className="bg-sage-950 text-sage-200 pt-16 pb-12 border-t border-sage-800">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-10">
              
              <div className="pb-8 border-b border-sage-800 grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                <div className="lg:col-span-6 space-y-1">
                  <div className="text-xl font-editorial tracking-[0.2em] font-light text-white">
                    ANIVE.CO | <span className="text-sm font-sans font-semibold text-sage-400">GIFTING</span>
                  </div>
                  <p className="text-xs text-sage-400 font-light">Curating moments of tranquil beauty through thoughtful objects, custom hot-foil monograms, and handwritten calligraphy.</p>
                </div>
                <div className="lg:col-span-6 flex gap-2">
                  <input type="email" placeholder="Join Atelier Journal for 10% off..." className="bg-sage-900 border border-sage-700 rounded-xl px-3 py-2 text-xs text-white flex-1 focus:outline-none" />
                  <button onClick={() => showToast('Subscribed! Welcome code: WELCOME10')} className="px-5 py-2 rounded-xl bg-sage-200 text-sage-950 text-xs font-semibold">Join</button>
                </div>
              </div>

              {/* 15 Categories Directory */}
              <div>
                <div className="text-xs font-semibold uppercase tracking-widest text-sage-400 mb-3">All 15 Specialized Collections</div>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 text-xs">
                  {CATEGORIES.map(c => (
                    <button
                      key={c.id}
                      onClick={() => {
                        setSelectedCategory(c.id);
                        const el = document.getElementById('catalog');
                        el?.scrollIntoView({ behavior: 'smooth' });
                      }}
                      className="text-left text-sage-300 hover:text-white transition py-1 text-[11px] truncate"
                    >
                      • {c.name}
                    </button>
                  ))}
                </div>
              </div>

              <div className="pt-6 border-t border-sage-800 text-[11px] text-sage-500 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>© 2026 ANIVE.CO | GIFTING. All Rights Reserved. Crafted with calm intention.</div>
                <div className="flex gap-4 text-sage-400">
                  <span>Privacy Policy</span>
                  <span>Terms</span>
                  <span>White-Glove Guarantee</span>
                </div>
              </div>

            </div>
          </footer>

          {/* --- INTERACTIVE 4-STEP CUSTOM BOX STUDIO MODAL --- */}
          {isBuilderOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-sage-950/75 backdrop-blur-md overflow-y-auto">
              <div className="bg-white w-full max-w-4xl rounded-3xl shadow-2xl border border-sage-200 overflow-hidden my-auto max-h-[92vh] flex flex-col">
                <div className="p-5 border-b border-sage-100 flex items-center justify-between bg-[#F8FAF9]">
                  <div>
                    <h3 className="font-editorial text-2xl font-medium text-sage-950">Custom Gift Box Studio</h3>
                    <p className="text-xs text-sage-500">Step {builderStep} of 4: Craft your bespoke gift box with personal touches</p>
                  </div>
                  <button onClick={() => setIsBuilderOpen(false)} className="text-sage-400 hover:text-sage-700 text-xl font-bold">✕</button>
                </div>

                <div className="flex border-b border-sage-100 text-xs font-semibold">
                  {[1, 2, 3, 4].map(s => (
                    <button
                      key={s}
                      onClick={() => setBuilderStep(s)}
                      className={`flex-1 py-2.5 text-center transition ${
                        builderStep === s ? 'border-b-2 border-sage-800 text-sage-900 bg-sage-50/50' : 'text-sage-400'
                      }`}
                    >
                      {s === 1 ? '1. Box Vessel' : s === 2 ? `2. Gifts (${bItems.length}/6)` : s === 3 ? '3. Ribbon & Foil' : '4. Calligraphy Card'}
                    </button>
                  ))}
                </div>

                <div className="p-6 flex-1 overflow-y-auto space-y-4">
                  {builderStep === 1 && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      {BUILDER_BOXES.map(box => (
                        <div
                          key={box.id}
                          onClick={() => setBBox(box)}
                          className={`p-4 rounded-2xl border cursor-pointer flex gap-4 items-center ${
                            bBox.id === box.id ? 'border-sage-800 bg-sage-50 ring-2 ring-sage-800/20' : 'border-sage-200'
                          }`}
                        >
                          <img src={box.image} alt={box.name} className="w-16 h-16 rounded-xl object-cover" />
                          <div>
                            <div className="font-semibold text-xs text-sage-900">{box.name}</div>
                            <div className="text-xs font-bold text-sage-800">{formatPrice(box.price)}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {builderStep === 2 && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                      {BUILDER_ITEMS.map(item => {
                        const has = bItems.some(i => i.id === item.id);
                        return (
                          <div
                            key={item.id}
                            onClick={() => toggleBItem(item)}
                            className={`p-3 rounded-2xl border cursor-pointer flex items-center justify-between ${
                              has ? 'border-sage-800 bg-sage-50' : 'border-sage-200'
                            }`}
                          >
                            <div>
                              <div className="text-[10px] text-sage-500 uppercase">{item.cat}</div>
                              <div className="text-xs font-semibold text-sage-900">{item.name}</div>
                              <div className="text-xs font-bold text-sage-700">{formatPrice(item.price)}</div>
                            </div>
                            <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${has ? 'bg-sage-800 text-white' : 'border border-sage-300'}`}>
                              {has ? '✓' : '+'}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {builderStep === 3 && (
                    <div className="space-y-4">
                      <div>
                        <label className="text-xs font-semibold text-sage-800 block mb-2">Select Hand-Torn Silk Ribbon</label>
                        <div className="grid grid-cols-2 sm:grid-cols-5 gap-2">
                          {RIBBONS.map(r => (
                            <button
                              key={r.id}
                              onClick={() => setBRibbon(r)}
                              className={`p-3 rounded-xl border flex flex-col items-center gap-1 text-xs ${
                                bRibbon.id === r.id ? 'border-sage-800 bg-sage-50 ring-1 ring-sage-800' : 'border-sage-200'
                              }`}
                            >
                              <span className="w-6 h-6 rounded-full border" style={{ backgroundColor: r.hex }}></span>
                              <span className="text-[11px] font-medium">{r.name.split(' ')[0]}</span>
                            </button>
                          ))}
                        </div>
                      </div>

                      <div className="p-4 bg-sage-50 rounded-2xl border border-sage-200 space-y-2">
                        <label className="text-xs font-bold text-sage-900 block">Hot-Foil Monogram (+{formatPrice(12)})</label>
                        <input
                          type="text"
                          maxLength="15"
                          value={bMonogram}
                          onChange={e => setBMonogram(e.target.value)}
                          placeholder="Initials or Name, e.g. E & J"
                          className="w-full bg-white border border-sage-300 rounded-xl px-3 py-2 text-xs text-sage-900 focus:outline-none"
                        />
                      </div>
                    </div>
                  )}

                  {builderStep === 4 && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                      <div className="space-y-3">
                        <input
                          type="text"
                          value={bRecipient}
                          onChange={e => setBRecipient(e.target.value)}
                          placeholder="Recipient Name"
                          className="w-full bg-sage-50 border border-sage-200 rounded-xl px-3 py-2 text-xs text-sage-900 focus:outline-none"
                        />
                        <textarea
                          rows="4"
                          value={bNote}
                          onChange={e => setBNote(e.target.value)}
                          className="w-full bg-sage-50 border border-sage-200 rounded-xl p-3 text-xs text-sage-900 focus:outline-none"
                        ></textarea>
                      </div>

                      <div className="p-6 rounded-2xl bg-[#FCFBF8] border border-amber-900/10 shadow space-y-2 text-center">
                        <div className="text-[10px] uppercase font-bold text-amber-800/60 pb-1 border-b border-amber-900/10">Live Calligraphy Note Preview</div>
                        <div className="text-xs uppercase tracking-widest text-sage-800 pt-2">To Dearest {bRecipient}</div>
                        <div className="font-editorial text-lg italic text-sage-900 whitespace-pre-line py-2">"{bNote}"</div>
                        <div className="text-[10px] text-sage-500 pt-2 border-t border-amber-900/10">✓ Wax-Sealed in Olive Green Wax</div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-4 border-t border-sage-100 bg-[#F8FAF9] flex items-center justify-between">
                  <span className="font-editorial text-lg font-bold text-sage-900">{formatPrice(totalBuilderPrice)}</span>
                  <div className="flex gap-2">
                    {builderStep > 1 && (
                      <button onClick={() => setBuilderStep(builderStep - 1)} className="px-4 py-2 rounded-xl border border-sage-300 text-xs font-semibold">
                        Back
                      </button>
                    )}
                    {builderStep < 4 ? (
                      <button onClick={() => setBuilderStep(builderStep + 1)} className="px-6 py-2 rounded-xl bg-sage-800 text-white text-xs font-semibold">
                        Next Step →
                      </button>
                    ) : (
                      <button
                        onClick={() => {
                          addToCart({
                            id: `custom-${Date.now()}`,
                            name: `Custom Box (${bBox.name})`,
                            categoryId: 'custom',
                            categoryName: 'Custom Gifting',
                            price: totalBuilderPrice,
                            image: bBox.image,
                            shortDesc: `${bItems.length} gifts in ${bBox.name}`
                          }, {
                            monogram: bMonogram ? `FOIL: ${bMonogram}` : null,
                            ribbon: bRibbon.name,
                            cardMessage: bNote
                          });
                          setIsBuilderOpen(false);
                        }}
                        className="px-6 py-2 rounded-xl bg-sage-900 text-white text-xs font-semibold shadow-luxury"
                      >
                        Add Custom Box to Bag ({formatPrice(totalBuilderPrice)})
                      </button>
                    )}
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* --- PRODUCT QUICK VIEW & CUSTOMISE MODAL --- */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-sage-950/75 backdrop-blur-md">
              <div className="bg-white w-full max-w-2xl rounded-3xl p-6 shadow-2xl border border-sage-200 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-sage-100 pb-2">
                  <span className="text-xs font-semibold text-sage-600 uppercase">{selectedProduct.categoryName}</span>
                  <button onClick={() => setSelectedProduct(null)} className="text-sage-400 hover:text-sage-700 text-xl font-bold">✕</button>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <img src={selectedProduct.image} alt={selectedProduct.name} className="w-full h-48 sm:h-full object-cover rounded-2xl" />
                  <div className="space-y-3">
                    <h3 className="font-editorial text-2xl font-medium text-sage-900">{selectedProduct.name}</h3>
                    <div className="text-xl font-editorial font-bold text-sage-900">{formatPrice(selectedProduct.price)}</div>
                    <p className="text-xs text-sage-600">{selectedProduct.fullDesc}</p>
                    
                    <div className="p-3 bg-sage-50 rounded-xl text-xs space-y-1">
                      <div className="font-semibold text-sage-800">Contents:</div>
                      {selectedProduct.contents.map((item, i) => (
                        <div key={i} className="text-[11px] text-sage-600">• {item}</div>
                      ))}
                    </div>

                    <button
                      onClick={() => {
                        addToCart(selectedProduct);
                        setSelectedProduct(null);
                      }}
                      className="w-full py-3 bg-sage-900 hover:bg-black text-white text-xs font-semibold rounded-xl shadow-luxury transition"
                    >
                      Add Box to Bag • {formatPrice(selectedProduct.price)}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* --- GIFT SOURCING CONCIERGE MODAL --- */}
          {isSourcingOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-sage-950/75 backdrop-blur-md">
              <div className="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl border border-sage-200 space-y-4">
                <div className="flex justify-between items-center border-b border-sage-100 pb-2">
                  <h3 className="font-editorial text-xl font-medium text-sage-900">VIP Gift Sourcing & Curation</h3>
                  <button onClick={() => setIsSourcingOpen(false)} className="text-sage-400 hover:text-sage-700 text-xl font-bold">✕</button>
                </div>
                <p className="text-xs text-sage-600">Request our dedicated sourcing concierge to discover rare global items, custom wedding favours, or volume PR gift boxes.</p>
                <form onSubmit={(e) => { e.preventDefault(); showToast('VIP Brief received! Concierge will reach out in 2 hours.'); setIsSourcingOpen(false); }} className="space-y-3">
                  <input type="text" required placeholder="Your Name" className="w-full bg-sage-50 border border-sage-200 rounded-xl px-3 py-2 text-xs text-sage-900 focus:outline-none" />
                  <input type="email" required placeholder="Your Email" className="w-full bg-sage-50 border border-sage-200 rounded-xl px-3 py-2 text-xs text-sage-900 focus:outline-none" />
                  <select className="w-full bg-sage-50 border border-sage-200 rounded-xl px-3 py-2 text-xs text-sage-900 focus:outline-none">
                    <option>Wedding Favours & Guest Boxes</option>
                    <option>Corporate Board & Executive Gifting</option>
                    <option>Rare Luxury Vintage / Artisan Sourcing</option>
                  </select>
                  <textarea rows="3" placeholder="Tell us about the desired aesthetic or item..." className="w-full bg-sage-50 border border-sage-200 rounded-xl p-3 text-xs text-sage-900 focus:outline-none"></textarea>
                  <button type="submit" className="w-full py-3 bg-sage-900 text-white rounded-xl text-xs font-semibold shadow-luxury">
                    Submit Private Sourcing Brief
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* --- SLIDE-OVER CART DRAWER --- */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 overflow-hidden">
              <div onClick={() => setIsCartOpen(false)} className="absolute inset-0 bg-sage-950/60 backdrop-blur-sm"></div>
              <div className="fixed inset-y-0 right-0 max-w-full flex pl-10">
                <div className="w-screen max-w-md bg-white shadow-2xl flex flex-col border-l border-sage-200">
                  
                  <div className="p-5 border-b border-sage-100 flex items-center justify-between bg-[#F8FAF9]">
                    <h3 className="font-editorial text-xl font-medium text-sage-950">Your Gifting Bag</h3>
                    <button onClick={() => setIsCartOpen(false)} className="text-sage-400 hover:text-sage-700 text-xl font-bold">✕</button>
                  </div>

                  <div className="flex-1 overflow-y-auto p-5 space-y-3">
                    {cart.length === 0 ? (
                      <div className="py-20 text-center space-y-2">
                        <div className="text-4xl">🛍️</div>
                        <h4 className="font-editorial text-xl text-sage-900">Your bag is empty</h4>
                        <p className="text-xs text-sage-500">Discover our 15 collections or design a custom box.</p>
                      </div>
                    ) : (
                      cart.map(item => (
                        <div key={item.key} className="p-3 rounded-2xl border border-sage-200 bg-[#FBFBFA] flex gap-3">
                          <img src={item.product.image} alt={item.product.name} className="w-16 h-16 rounded-xl object-cover" />
                          <div className="flex-1 min-w-0 space-y-1">
                            <div className="flex justify-between items-start">
                              <h4 className="text-xs font-bold text-sage-900 truncate">{item.product.name}</h4>
                              <button onClick={() => updateQty(item.key, -item.quantity)} className="text-sage-400 hover:text-red-500 text-xs">✕</button>
                            </div>
                            <div className="text-xs font-editorial font-bold text-sage-900">{formatPrice(item.price)}</div>
                            <div className="flex items-center gap-2 pt-1">
                              <button onClick={() => updateQty(item.key, -1)} className="w-5 h-5 rounded border flex items-center justify-center text-xs">-</button>
                              <span className="text-xs font-bold">{item.quantity}</span>
                              <button onClick={() => updateQty(item.key, 1)} className="w-5 h-5 rounded border flex items-center justify-center text-xs">+</button>
                              <span className="text-xs text-sage-600 ml-auto font-semibold">{formatPrice(item.price * item.quantity)}</span>
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  {cart.length > 0 && (
                    <div className="p-5 border-t border-sage-200 bg-[#F8FAF9] space-y-3">
                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="Promo Code (WELCOME10)"
                          id="promoInput"
                          className="bg-white border border-sage-300 rounded-xl px-3 py-1.5 text-xs flex-1 uppercase focus:outline-none"
                        />
                        <button
                          onClick={() => {
                            const val = document.getElementById('promoInput')?.value?.toUpperCase();
                            if (val === 'WELCOME10') {
                              setAppliedPromo('WELCOME10');
                              showToast('10% Welcome discount applied!');
                            } else showToast('Invalid code. Try WELCOME10');
                          }}
                          className="px-3 py-1.5 bg-sage-800 text-white rounded-xl text-xs font-medium"
                        >
                          Apply
                        </button>
                      </div>

                      <div className="space-y-1 text-xs text-sage-600">
                        <div className="flex justify-between"><span>Subtotal:</span><span>{formatPrice(rawSubtotal)}</span></div>
                        {discount > 0 && <div className="flex justify-between text-emerald-700"><span>Discount:</span><span>-{formatPrice(discount)}</span></div>}
                        <div className="flex justify-between"><span>Shipping:</span><span>{shipping === 0 ? 'FREE' : formatPrice(shipping)}</span></div>
                        <div className="flex justify-between font-bold text-sage-900 pt-1 border-t text-sm">
                          <span>Total:</span><span className="font-editorial text-base">{formatPrice(totalUSD)}</span>
                        </div>
                      </div>

                      <button
                        onClick={() => {
                          setIsCartOpen(false);
                          setIsCheckoutOpen(true);
                        }}
                        className="w-full py-3.5 bg-sage-900 hover:bg-black text-white text-xs font-semibold rounded-2xl shadow-luxury transition"
                      >
                        Proceed to White-Glove Checkout →
                      </button>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

          {/* --- CHECKOUT CONFETTI MODAL --- */}
          {isCheckoutOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 bg-sage-950/75 backdrop-blur-md">
              <div className="bg-white w-full max-w-lg rounded-3xl p-6 sm:p-8 shadow-2xl border border-sage-200 space-y-4">
                <div className="flex justify-between items-center border-b border-sage-100 pb-2">
                  <h3 className="font-editorial text-2xl font-medium text-sage-900">White-Glove Order Checkout</h3>
                  <button onClick={() => setIsCheckoutOpen(false)} className="text-sage-400 hover:text-sage-700 text-xl font-bold">✕</button>
                </div>

                <div className="p-3 bg-sage-50 rounded-2xl flex justify-between items-center text-xs">
                  <span className="text-sage-600 font-medium">Order Total to Pay:</span>
                  <span className="font-editorial text-xl font-bold text-sage-900">{formatPrice(totalUSD)}</span>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  try {
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#6D9087', '#53726A', '#D4AF37'] });
                  } catch(err){}
                  showToast('Order confirmed! Atelier tracking number generated.');
                  setCart([]);
                  setIsCheckoutOpen(false);
                }} className="space-y-3 text-xs">
                  <input type="text" required placeholder="Recipient Full Name" className="w-full bg-sage-50 border border-sage-200 rounded-xl px-3 py-2 text-sage-900 focus:outline-none" />
                  <input type="email" required placeholder="Notification Email" className="w-full bg-sage-50 border border-sage-200 rounded-xl px-3 py-2 text-sage-900 focus:outline-none" />
                  <input type="text" required placeholder="Delivery Street Address" className="w-full bg-sage-50 border border-sage-200 rounded-xl px-3 py-2 text-sage-900 focus:outline-none" />
                  <div className="p-3 bg-white border border-sage-200 rounded-xl space-y-1">
                    <div className="text-[10px] text-sage-400 uppercase">Payment Method (Bank-grade SSL)</div>
                    <div className="text-xs text-sage-700 font-mono">•••• •••• •••• 4242 | 12/28</div>
                  </div>
                  <button type="submit" className="w-full py-3.5 bg-sage-900 hover:bg-black text-white text-xs font-semibold rounded-2xl shadow-luxury transition">
                    Confirm & Place Order ({formatPrice(totalUSD)})
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
